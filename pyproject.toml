[project]
name = "volml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "arch", "torch"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
fetch = ["yfinance"]

[tool.ruff]
line-length = 130
src = ["src"]
exclude = [".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "scripts/build_readme.py" = ["E501"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
